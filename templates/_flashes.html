{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    {% set icon = {'success': 'check-circle', 'danger': 'exclamation-circle', 'warning': 'exclamation-triangle'}.get(category, 'info-circle') %}
    <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show d-flex align-items-start gap-2" role="alert">
      <i class="bi bi-{{ icon }} mt-1"></i>
      <div>{{ message }}</div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
{% endwith %}
