{% extends 'base.html' %}
{% block title %}Error {{ code }}{% endblock %}

{% block public %}
<div class="text-center">
  <div class="display-5 fw-semibold text-primary">{{ code }}</div>
  <p class="text-secondary mt-2">{{ message }}</p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Go to login</a>
</div>
{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body text-center py-5">
    <div class="display-5 fw-semibold text-primary">{{ code }}</div>
    <p class="text-secondary mt-2">{{ message }}</p>
    <a href="{{ url_for(g.role + '.dashboard') }}" class="btn btn-primary">Back to dashboard</a>
  </div>
</div>
{% endblock %}
